<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suto Cafe — Stamp Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --suto-blue:#1B4C8C;
    --suto-blue-dark:#0F2E5C;
    --ink:#12233B;
    --cream:#F6F2E9;
    --cream-2:#EFE8D8;
    --amber:#C6813F;
    --amber-dark:#9E6329;
    --line: rgba(18,35,59,0.12);
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* header */
  .topbar{
    background:var(--suto-blue);
    color:var(--white);
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle at 18% 30%, rgba(255,255,255,0.08) 0, transparent 40%),
                       radial-gradient(circle at 85% 75%, rgba(255,255,255,0.06) 0, transparent 45%);
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
  .brand-name{font-weight:800; font-size:26px; letter-spacing:0.5px;}
  .brand-tag{font-size:12px; opacity:0.85; margin-top:2px; font-weight:500;}
  .staff-btn{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    color:var(--white);
    border-radius:20px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
  }

  /* nav */
  .tabs{
    display:flex;
    background:var(--white);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:13px 6px;
    font-size:13.5px;
    font-weight:600;
    color:#7c8798;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab.active{ color:var(--suto-blue); border-bottom-color:var(--amber); }

  .content{ padding:22px 20px 90px; flex:1; }

  /* generic */
  .field-label{font-size:13px; font-weight:600; color:#55637a; margin-bottom:6px; display:block;}
  input[type=text], input[type=tel]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:15px;
    font-family:'Inter',sans-serif;
    background:var(--white);
    color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--suto-blue);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--suto-blue); color:var(--white); }
  .btn-primary:disabled{ background:#a9b6c9; cursor:not-allowed; }
  .btn-amber{ background:var(--amber); color:var(--white); }
  .btn-amber:disabled{ background:#e3cba8; color:#fff; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--suto-blue); border:1.5px solid var(--suto-blue); }
  .btn-outline-white{ background:transparent; color:var(--white); border:1.5px solid rgba(255,255,255,0.6); }

  .card-panel{
    background:var(--white);
    border-radius:18px;
    padding:20px;
    border:1px solid var(--line);
  }

  /* stamp card */
  .punch-card{
    background:var(--suto-blue-dark);
    background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 40%);
    border-radius:20px;
    padding:22px 18px 18px;
    color:var(--white);
    position:relative;
  }
  .punch-card .cust-name{ font-weight:700; font-size:17px; }
  .punch-card .cust-phone{ font-size:12px; opacity:0.7; margin-top:2px;}
  .stamp-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:10px;
    margin-top:18px;
  }
  .stamp-slot{
    aspect-ratio:1;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06);
    border:1.5px dashed rgba(255,255,255,0.35);
  }
  .stamp-slot.filled{
    background:var(--amber);
    border:1.5px solid var(--amber);
    animation:pop .3s ease;
  }
  .stamp-slot.milestone:not(.filled){ border-color:rgba(199,140,80,0.8); }
  @keyframes pop{ 0%{transform:scale(0.4); opacity:0;} 70%{transform:scale(1.12);} 100%{transform:scale(1); opacity:1;} }
  .cup-icon{ width:58%; height:58%; }

  .progress-text{ margin-top:16px; font-size:13px; opacity:0.9; display:flex; justify-content:space-between;}

  .reward-strip{
    margin-top:16px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .reward-pill{
    flex:0 0 auto;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;
    padding:10px 12px;
    min-width:104px;
  }
  .reward-pill.unlocked{ background:rgba(198,129,63,0.25); border-color:var(--amber); }
  .reward-pill .rp-count{ font-size:11px; opacity:0.75; }
  .reward-pill .rp-name{ font-size:12.5px; font-weight:700; margin-top:2px; }

  .section-title{ font-weight:700; font-size:15px; margin:26px 0 10px; }
  .history-row{
    display:flex; justify-content:space-between; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .history-row:last-child{ border-bottom:none; }
  .muted{ color:#7c8798; }

  .empty-state{ text-align:center; padding:40px 10px; color:#7c8798; }
  .empty-state svg{ width:56px; height:56px; margin-bottom:10px; opacity:0.6; }

  .banner{
    border-radius:14px;
    padding:14px 16px;
    font-size:13.5px;
    margin-bottom:16px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .banner.success{ background:#E7F4EA; color:#256A3B; border:1px solid #BFE3C7; }
  .banner.info{ background:#EAF1FB; color:var(--suto-blue-dark); border:1px solid #CFE0F5; }
  .banner.warn{ background:#FBF0E4; color:#8A5A16; border:1px solid #F0DCB8; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; color:#8a95a6; padding:8px 6px; border-bottom:1px solid var(--line); }
  td{ padding:9px 6px; border-bottom:1px solid var(--line); }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:1px solid var(--line); background:var(--white); border-radius:8px;
    padding:5px 8px; font-size:12px; cursor:pointer; color:var(--ink);
  }
  .icon-btn.amber{ border-color:var(--amber); color:var(--amber-dark); }

  .qr-box{ text-align:center; padding:18px; background:var(--white); border-radius:16px; border:1px solid var(--line); }
  .qr-box img{ border-radius:8px; }
  .link-box{
    background:var(--cream-2); border-radius:10px; padding:10px 12px; font-size:12px;
    word-break:break-all; color:#55637a; margin-top:10px;
  }

  .toggle-row{ display:flex; gap:10px; margin-top:8px; }
  .toggle-opt{
    flex:1; text-align:center; padding:10px; border-radius:12px; border:1.5px solid var(--line);
    font-weight:700; font-size:13.5px; cursor:pointer; color:#55637a;
  }
  .toggle-opt.selected{ border-color:var(--suto-blue); color:var(--suto-blue); background:#EAF1FB; }

  .footer-note{ text-align:center; font-size:11.5px; color:#9aa4b2; margin-top:28px; }

  .crosslinks{
    display:flex; gap:8px; padding:10px 20px; background:var(--white);
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  .crosslinks a{
    flex:0 0 auto;
    font-size:12.5px; font-weight:600; color:var(--suto-blue);
    text-decoration:none; padding:6px 12px; border-radius:100px;
    border:1px solid var(--line); white-space:nowrap;
  }
  .crosslinks a:hover{ border-color:var(--suto-blue); }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* ---------------- storage helpers ---------------- */
const CONFIG_KEY = 'suto:config';
const STAFF_PIN = '2580';
const REVIEW_URL = 'https://www.google.com/maps/place/?q=place_id:ChIJ-Wcu803XyTsRiVZAQSPcSj8';

async function getConfig(){
  try{
    const r = await window.storage.get(CONFIG_KEY, true);
    return r ? JSON.parse(r.value) : { cardSize: 7 };
  }catch(e){ return { cardSize: 7 }; }
}
async function setConfig(cfg){
  await window.storage.set(CONFIG_KEY, JSON.stringify(cfg), true);
}
function custKey(phone){ return 'suto:customer:' + phone.trim(); }

async function getCustomer(phone){
  try{
    const r = await window.storage.get(custKey(phone), true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveCustomer(c){
  await window.storage.set(custKey(c.phone), JSON.stringify(c), true);
}
async function listCustomers(){
  try{
    const r = await window.storage.list('suto:customer:', true);
    if(!r || !r.keys) return [];
    const out = [];
    for(const k of r.keys){
      try{
        const v = await window.storage.get(k, true);
        if(v) out.push(JSON.parse(v.value));
      }catch(e){}
    }
    return out.sort((a,b)=> (b.lastVisit||0) - (a.lastVisit||0));
  }catch(e){ return []; }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowLabel(){
  return new Date().toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function rewardsFor(cardSize){
  if(cardSize === 14){
    return [
      { at:7,  label:'10% off your bill' },
      { at:14, label:'Free combo + Suto cup' }
    ];
  }
  return [
    { at:4, label:'10% off your bill' },
    { at:7, label:'Free combo (fries + drink)' }
  ];
}

/* ---------------- state ---------------- */
const params = new URLSearchParams(location.search);
let state = {
  view: params.get('checkin') === '1' ? 'checkin' : 'card',
  phone: '',
  customer: null,
  config: { cardSize: 7 },
  staffAuthed: false,
  staffPhone: '',
  banner: null,
};

const cupSVG = (filled) => `
<svg class="cup-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 8h13v6.5A4.5 4.5 0 0 1 12.5 19h-4A4.5 4.5 0 0 1 4 14.5V8Z" stroke="${filled? '#0F2E5C':'#ffffff'}" stroke-opacity="${filled?1:0.55}" stroke-width="1.6"/>
  <path d="M17 9.5h1.5a2.5 2.5 0 0 1 0 5H17" stroke="${filled? '#0F2E5C':'#ffffff'}" stroke-opacity="${filled?1:0.55}" stroke-width="1.6"/>
  <path d="M7 5.2c0-.7.5-1 .5-1.7 0-.5-.2-.7-.4-1M11 5.2c0-.7.5-1 .5-1.7 0-.5-.2-.7-.4-1" stroke="${filled? '#0F2E5C':'#ffffff'}" stroke-opacity="${filled?0.9:0.4}" stroke-width="1.4" stroke-linecap="round"/>
</svg>`;

function render(){
  const el = document.getElementById('app');
  el.innerHTML = `
    <div class="topbar">
      <div class="brand-row">
        <div>
          <div class="brand-name">Suto Cafe</div>
          <div class="brand-tag">Jee Bhar Ke — loyalty card</div>
        </div>
        <button class="staff-btn" id="staffBtn">Staff</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${state.view==='card'?'active':''}" data-tab="card">My Card</div>
      <div class="tab ${state.view==='checkin'?'active':''}" data-tab="checkin">Check In</div>
    </div>
    <div class="crosslinks">
      <a href="index.html">Home</a>
      <a href="suto-menu.html">Digital Menu</a>
      <a href="${REVIEW_URL}" target="_blank" rel="noopener">Leave a Google Review</a>
    </div>
    <div class="content" id="content"></div>
  `;
  document.getElementById('staffBtn').onclick = () => { state.view = 'staff'; render(); };
  el.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.view = t.dataset.tab; state.banner=null; render(); });

  const content = document.getElementById('content');
  if(state.view === 'card') content.innerHTML = viewCard();
  else if(state.view === 'checkin') content.innerHTML = viewCheckin();
  else if(state.view === 'staff') content.innerHTML = viewStaff();

  attachHandlers();
}

/* ---------------- views ---------------- */
function bannerHTML(){
  if(!state.banner) return '';
  const cls = state.banner.type || 'info';
  return `<div class="banner ${cls}">${state.banner.text}</div>`;
}

function viewCard(){
  return `
    ${bannerHTML()}
    <label class="field-label">Your phone number</label>
    <input type="tel" id="cardPhone" placeholder="e.g. 9876543210" value="${state.phone}" maxlength="10">
    <div style="margin-top:10px;">
      <button class="btn btn-primary" id="lookupBtn">View my card</button>
    </div>
    <div id="cardResult" style="margin-top:20px;"></div>
  `;
}

function renderCardResult(){
  const container = document.getElementById('cardResult');
  if(!container) return;
  const c = state.customer;
  if(!c){
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8h13v6.5A4.5 4.5 0 0 1 12.5 19h-4A4.5 4.5 0 0 1 4 14.5V8Z" stroke="#9aa4b2" stroke-width="1.4"/><path d="M17 9.5h1.5a2.5 2.5 0 0 1 0 5H17" stroke="#9aa4b2" stroke-width="1.4"/></svg>
        <div>Enter your phone number to find your stamp card.</div>
      </div>`;
    return;
  }
  const size = state.config.cardSize;
  const rewards = rewardsFor(size);
  const stampsInCycle = c.stamps % size === 0 && c.stamps > 0 ? size : c.stamps % size;
  const slots = Array.from({length:size}, (_,i)=> i+1);
  const milestoneSet = new Set(rewards.map(r=>r.at));
  const nextReward = rewards.find(r => r.at > stampsInCycle) || rewards[rewards.length-1];
  const stampsToGo = Math.max(0, (nextReward ? nextReward.at : size) - stampsInCycle);
  const unlockedReward = rewards.find(r => r.at === stampsInCycle);

  container.innerHTML = `
    <div class="punch-card">
      <div class="cust-name">${escapeHTML(c.name || 'Guest')}</div>
      <div class="cust-phone">${c.phone}</div>
      <div class="stamp-grid">
        ${slots.map(n => `
          <div class="stamp-slot ${n<=stampsInCycle?'filled':''} ${milestoneSet.has(n)?'milestone':''}">
            ${cupSVG(n<=stampsInCycle)}
          </div>`).join('')}
      </div>
      <div class="progress-text">
        <span>${stampsInCycle}/${size} stamps</span>
        <span>${stampsToGo===0 ? 'Reward ready!' : stampsToGo + ' to go'}</span>
      </div>
      <div class="reward-strip">
        ${rewards.map(r => `
          <div class="reward-pill ${stampsInCycle>=r.at?'unlocked':''}">
            <div class="rp-count">${r.at} stamps</div>
            <div class="rp-name">${r.label}</div>
          </div>`).join('')}
      </div>
    </div>
    ${unlockedReward ? `
      <div style="margin-top:14px;">
        <button class="btn btn-amber" id="redeemBtn" data-at="${unlockedReward.at}">
          Redeem: ${unlockedReward.label}
        </button>
      </div>` : ''}
    <div class="section-title">Recent activity</div>
    <div class="card-panel">
      ${(c.history && c.history.length) ? c.history.slice().reverse().slice(0,8).map(h => `
        <div class="history-row">
          <span>${h.type === 'stamp' ? 'Stamp added' : 'Reward redeemed — ' + h.label}</span>
          <span class="muted">${h.when}</span>
        </div>`).join('') : `<div class="muted" style="padding:6px 0;">No activity yet — visit the counter to get your first stamp.</div>`}
    </div>
    <div class="footer-note">Card resets automatically after every ${size} stamps.</div>
  `;

  const redeemBtn = document.getElementById('redeemBtn');
  if(redeemBtn){
    redeemBtn.onclick = async () => {
      const at = parseInt(redeemBtn.dataset.at, 10);
      const reward = rewards.find(r=>r.at===at);
      c.history = c.history || [];
      c.history.push({ type:'redeem', label: reward.label, when: nowLabel() });
      // reset cycle stamps for this milestone tier: if it's the final tier, reset to 0; else just mark redeemed for progress display purposes
      if(at === size){
        c.stamps = 0;
      } else {
        // move stamps forward so this milestone isn't re-offered until next cycle
        c.redeemedMilestones = c.redeemedMilestones || [];
        c.redeemedMilestones.push({ at, cycle: Math.floor(c.stamps / size) });
      }
      await saveCustomer(c);
      state.customer = c;
      state.banner = { type:'success', text: `Redeemed: ${reward.label}. Show this screen to staff.<br><a href="${REVIEW_URL}" target="_blank" rel="noopener" style="color:#256A3B; font-weight:700;">Glad you stuck around — leave us a quick review? →</a>` };
      render();
    };
  }
}

function viewCheckin(){
  return `
    ${bannerHTML()}
    <div class="banner info">Scan this at the counter after your order, or enter your number below to collect today's stamp.</div>
    <label class="field-label">Phone number</label>
    <input type="tel" id="ciPhone" placeholder="e.g. 9876543210" value="${state.phone}" maxlength="10">
    <div id="nameFieldWrap"></div>
    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="ciContinue">Continue</button>
    </div>
  `;
}

function viewStaff(){
  if(!state.staffAuthed){
    return `
      ${bannerHTML()}
      <div class="card-panel">
        <label class="field-label">Staff PIN</label>
        <input type="text" id="pinInput" placeholder="Enter PIN">
        <div style="margin-top:12px;">
          <button class="btn btn-primary" id="pinSubmit">Unlock</button>
        </div>
      </div>
    `;
  }
  return `
    ${bannerHTML()}
    <div class="card-panel">
      <label class="field-label">Card length</label>
      <div class="toggle-row">
        <div class="toggle-opt ${state.config.cardSize===7?'selected':''}" data-size="7">7 stamps</div>
        <div class="toggle-opt ${state.config.cardSize===14?'selected':''}" data-size="14">14 stamps</div>
      </div>
    </div>

    <div class="section-title">Add a stamp for a customer</div>
    <div class="card-panel">
      <label class="field-label">Phone number</label>
      <input type="tel" id="staffPhone" placeholder="Customer phone" maxlength="10">
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="staffAddStamp">Add stamp</button>
        <button class="btn btn-ghost" id="staffLookup">Look up</button>
      </div>
    </div>

    <div class="section-title">QR code for the counter</div>
    <div class="qr-box">
      <img id="qrImg" width="180" height="180" alt="Check-in QR code">
      <div class="link-box" id="qrLink"></div>
    </div>

    <div class="section-title">All customers</div>
    <div class="card-panel" style="overflow-x:auto;">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Stamps</th><th></th></tr></thead>
        <tbody id="custTableBody"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  `;
}

/* ---------------- handlers ---------------- */
function escapeHTML(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function validPhone(p){ return /^[0-9]{7,12}$/.test(p.trim()); }

async function attachHandlers(){
  state.config = await getConfig();

  if(state.view === 'card'){
    const btn = document.getElementById('lookupBtn');
    if(btn) btn.onclick = async () => {
      const phone = document.getElementById('cardPhone').value.trim();
      if(!validPhone(phone)){ state.banner = {type:'warn', text:'Enter a valid phone number.'}; render(); return; }
      state.phone = phone;
      const c = await getCustomer(phone);
      state.customer = c;
      state.banner = c ? null : {type:'info', text:'No card found for this number yet — check in at the counter to start one.'};
      render();
      renderCardResult();
    };
    if(state.customer) renderCardResult();
  }

  if(state.view === 'checkin'){
    const nameWrap = document.getElementById('nameFieldWrap');
    const contBtn = document.getElementById('ciContinue');
    let stage = 'phone';

    contBtn.onclick = async () => {
      const phone = document.getElementById('ciPhone').value.trim();
      if(!validPhone(phone)){ state.banner = {type:'warn', text:'Enter a valid phone number.'}; render(); return; }

      if(stage === 'phone'){
        const existing = await getCustomer(phone);
        if(existing){
          await runCheckin(phone, existing.name);
          return;
        }
        stage = 'name';
        state.phone = phone;
        nameWrap.innerHTML = `
          <label class="field-label" style="margin-top:14px; display:block;">Your name (for your card)</label>
          <input type="text" id="ciName" placeholder="e.g. Priya">
        `;
        contBtn.textContent = 'Get my stamp';
        return;
      }
      if(stage === 'name'){
        const nameEl = document.getElementById('ciName');
        const name = nameEl ? nameEl.value.trim() : '';
        if(!name){ state.banner = {type:'warn', text:'Please enter your name.'}; render(); return; }
        await runCheckin(phone, name);
      }
    };
  }

  if(state.view === 'staff' && !state.staffAuthed){
    const submit = document.getElementById('pinSubmit');
    if(submit) submit.onclick = () => {
      const pin = document.getElementById('pinInput').value.trim();
      if(pin === STAFF_PIN){ state.staffAuthed = true; state.banner=null; render(); }
      else { state.banner = {type:'warn', text:'Incorrect PIN.'}; render(); }
    };
  }

  if(state.view === 'staff' && state.staffAuthed){
    document.querySelectorAll('.toggle-opt').forEach(t => t.onclick = async () => {
      state.config.cardSize = parseInt(t.dataset.size, 10);
      await setConfig(state.config);
      render();
    });

    document.getElementById('staffAddStamp').onclick = async () => {
      const phone = document.getElementById('staffPhone').value.trim();
      if(!validPhone(phone)){ state.banner = {type:'warn', text:'Enter a valid phone number.'}; render(); return; }
      let c = await getCustomer(phone);
      if(!c){ c = { phone, name:'Guest', stamps:0, history:[], createdAt: Date.now() }; }
      c.stamps = (c.stamps||0) + 1;
      c.lastVisit = Date.now();
      c.history = c.history || [];
      c.history.push({ type:'stamp', when: nowLabel() });
      await saveCustomer(c);
      state.banner = {type:'success', text:`Stamp added for ${phone}. Total: ${c.stamps}.`};
      render();
    };

    document.getElementById('staffLookup').onclick = async () => {
      const phone = document.getElementById('staffPhone').value.trim();
      if(!validPhone(phone)){ state.banner = {type:'warn', text:'Enter a valid phone number.'}; render(); return; }
      state.view = 'card'; state.phone = phone;
      const c = await getCustomer(phone);
      state.customer = c;
      render();
      renderCardResult();
    };

    const url = new URL(location.href);
    url.searchParams.set('checkin','1');
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url.toString());
    const qrImg = document.getElementById('qrImg');
    if(qrImg) qrImg.src = qrUrl;
    const qrLink = document.getElementById('qrLink');
    if(qrLink) qrLink.textContent = url.toString();

    const tbody = document.getElementById('custTableBody');
    if(tbody){
      const list = await listCustomers();
      tbody.innerHTML = list.length ? list.map(c => `
        <tr>
          <td>${escapeHTML(c.name||'Guest')}</td>
          <td>${c.phone}</td>
          <td>${c.stamps||0}</td>
          <td class="row-actions">
            <button class="icon-btn amber" data-phone="${c.phone}" data-act="stamp">+1</button>
            <button class="icon-btn" data-phone="${c.phone}" data-act="reset">Reset</button>
          </td>
        </tr>`).join('') : `<tr><td colspan="4" class="muted">No customers yet.</td></tr>`;

      tbody.querySelectorAll('button[data-act="stamp"]').forEach(b => b.onclick = async () => {
        const c = await getCustomer(b.dataset.phone);
        if(!c) return;
        c.stamps = (c.stamps||0) + 1;
        c.lastVisit = Date.now();
        c.history = c.history || [];
        c.history.push({ type:'stamp', when: nowLabel() });
        await saveCustomer(c);
        render();
      });
      tbody.querySelectorAll('button[data-act="reset"]').forEach(b => b.onclick = async () => {
        const c = await getCustomer(b.dataset.phone);
        if(!c) return;
        c.stamps = 0;
        c.history = c.history || [];
        c.history.push({ type:'redeem', label:'Manual reset', when: nowLabel() });
        await saveCustomer(c);
        render();
      });
    }
  }
}

async function runCheckin(phone, name){
  let c = await getCustomer(phone);
  const today = todayStr();
  if(!c){
    c = { phone, name, stamps:0, history:[], createdAt: Date.now(), lastStampDate:'' };
  }
  if(c.lastStampDate === today){
    state.phone = phone;
    state.customer = c;
    state.banner = {type:'warn', text:"You've already collected today's stamp. Come back tomorrow!"};
    state.view = 'card';
    render();
    renderCardResult();
    return;
  }
  c.stamps = (c.stamps||0) + 1;
  c.lastStampDate = today;
  c.lastVisit = Date.now();
  c.name = name || c.name;
  c.history = c.history || [];
  c.history.push({ type:'stamp', when: nowLabel() });
  await saveCustomer(c);

  state.phone = phone;
  state.customer = c;
  state.banner = {type:'success', text:'Stamp collected! Thanks for visiting Suto Cafe.'};
  state.view = 'card';
  render();
  renderCardResult();
}

render();
</script>
