<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUTO — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F2748;
    --bg-soft: #16335E;
    --line: #274877;
    --cream: #EAF2FB;
    --muted: #8FA8C9;
    --gold: #4C86D6;
    --gold-dim: #2C63A8;
    --veg: #4caf6a;
    --chili: #C1442B;
    --bar1: 60px;
    --bar2: 46px;
    --bar3: 46px;
  }
  html[data-theme="light"]{
    --bg: #EAF2FB;
    --bg-soft: #DCE9F7;
    --line: #C3D8F0;
    --cream: #122038;
    --muted: #5A7196;
    --gold: #2C63A8;
    --gold-dim: #4C86D6;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ transition: none !important; animation: none !important; }
  }
  body{
    margin:0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  svg{ display:block; }

  /* ---------- Hero ---------- */
  .hero{
    position: relative;
    padding: 3.6rem 1.5rem 2.6rem;
    text-align: center;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(217,167,90,0.18), transparent 60%),
      var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .hero-art{
    width: 84px; height: 84px;
    margin: 0 auto 1.2rem;
    color: var(--gold);
    opacity: 0.95;
  }

  .group-banner{
    width: 100%;
    height: 108px;
    border-radius: 10px;
    margin: 1rem 0 1.8rem;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    border: 1px solid var(--line);
  }
  .group-banner svg{
    width: 40px; height: 40px;
    color: var(--gold);
    opacity: 0.85;
  }
  .theme-toggle{
    position: absolute;
    top: 1.1rem; right: 1.1rem;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items:center; justify-content:center;
  }
  .theme-toggle:hover{ color: var(--gold); border-color: var(--gold-dim); }
  .crosslinks{
    position: absolute;
    top: 1.1rem; left: 1.1rem;
    display: flex; gap: 8px;
    z-index: 3;
  }
  .crosslinks a{
    display:flex; align-items:center; gap:5px;
    padding: 7px 12px;
    border-radius: 100px;
    border: 1px solid var(--line);
    color: var(--muted);
    text-decoration: none;
    font-size: 0.76rem;
    font-weight: 500;
    background: transparent;
  }
  .crosslinks a:hover{ color: var(--gold); border-color: var(--gold-dim); }
  .ring{
    position: relative;
    width: 70px; height: 70px;
    margin: 0 auto 1.4rem;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .ring::after{
    content:"";
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--gold);
    opacity: .85;
  }
  .hero h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.6rem, 8vw, 4rem);
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--cream);
  }
  .hero p{
    margin: 0.8rem auto 0;
    max-width: 32ch;
    color: var(--muted);
    font-size: 0.96rem;
    line-height: 1.6;
  }

  /* ---------- Sticky bars ---------- */
  .searchbar{
    position: sticky; top: 0; z-index: 30;
    height: var(--bar1);
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0 1.2rem;
    background: rgba(15,39,72,0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  html[data-theme="light"] .searchbar{ background: rgba(234,242,251,0.94); }
  .searchbar svg{ color: var(--muted); flex-shrink:0; }
  .searchbar input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.98rem;
  }
  .searchbar input::placeholder{ color: var(--muted); }
  .searchbar .clear{
    background:none; border:none; color: var(--muted); cursor:pointer;
    display:none; padding: 0.2rem;
  }
  .searchbar .clear.show{ display:flex; }

  nav.grouptabs{
    position: sticky; top: var(--bar1); z-index: 29;
    height: var(--bar2);
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0 1.2rem;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    white-space: nowrap;
  }
  nav.grouptabs button{
    font-family: 'Fraunces', serif;
    font-size: 0.98rem;
    font-weight: 500;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0.3rem 0.2rem;
    border-bottom: 2px solid transparent;
  }
  nav.grouptabs button.active{
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  nav.subnav{
    position: sticky; top: calc(var(--bar1) + var(--bar2)); z-index: 28;
    min-height: var(--bar3);
    display: flex; align-items: center; gap: 0.35rem;
    padding: 0.55rem 1.2rem;
    background: rgba(15,39,72,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  html[data-theme="light"] nav.subnav{ background: rgba(234,242,251,0.92); }
  nav.subnav::-webkit-scrollbar{ display:none; }
  nav.subnav a{
    display: inline-flex; align-items: center; gap: 0.35rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.84rem;
    padding: 0.38rem 0.8rem;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  nav.subnav a svg{ width:15px; height:15px; }
  nav.subnav a.active{
    color: var(--gold);
    border-color: var(--gold-dim);
  }

  /* ---------- Content ---------- */
  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
  }
  .group-block.hidden, .category.hidden, ul.items li.hidden{ display: none !important; }

  .group-title{
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--gold);
    margin: 3.2rem 0 0.2rem;
  }
  .group-block:first-child .group-title{ margin-top: 2rem; }
  .group-sub{
    color: var(--muted);
    font-size: 0.87rem;
    margin-bottom: 1.5rem;
  }
  section.category{
    scroll-margin-top: calc(var(--bar1) + var(--bar2) + var(--bar3) + 0.8rem);
    padding-top: 1.7rem;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .5s ease, transform .5s ease;
  }
  section.category.in-view{ opacity: 1; transform: translateY(0); }
  section.category:first-of-type{ padding-top: 0.4rem; }

  .cat-heading{
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.82rem;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.6rem;
    margin-bottom: 0.9rem;
  }
  .cat-heading svg{ width:16px; height:16px; color: var(--gold); }

  ul.items{ list-style: none; margin: 0 0 0.5rem; padding: 0; }
  ul.items li{
    padding: 0.6rem 0;
    border-bottom: 1px dashed var(--line);
  }
  ul.items li:last-child{ border-bottom: none; }
  .row{
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }
  .veg{
    flex-shrink: 0;
    width: 11px; height: 11px;
    border: 1.3px solid var(--veg);
    position: relative;
    top: 1px;
  }
  .veg::after{
    content:"";
    position:absolute;
    width: 5px; height: 5px;
    background: var(--veg);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }
  .item-name{
    font-size: 1rem;
    color: var(--cream);
    font-weight: 500;
  }
  .spice{ color: var(--chili); flex-shrink:0; width:13px; height:13px; }
  .leader{
    flex: 1;
    border-bottom: 1px dotted var(--gold-dim);
    height: 0;
    margin-bottom: 0.35rem;
  }
  .price{
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    color: var(--gold);
    font-weight: 500;
    white-space: nowrap;
  }
  .item-desc{
    margin: 0.2rem 0 0 1.6rem;
    color: var(--muted);
    font-size: 0.84rem;
    line-height: 1.4;
  }
  .badge{
    display: inline-block;
    margin-left: 1.6rem;
    margin-top: 0.3rem;
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 0.12rem 0.5rem;
    border-radius: 999px;
  }

  .addon{ margin-top: 0.9rem; font-size: 0.86rem; color: var(--muted); }
  .addon b{ color: var(--cream); font-weight: 500; }
  .addon-row{ display:inline-block; margin-right: 1rem; }

  .no-results{
    text-align:center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.95rem;
    display: none;
  }
  .no-results.show{ display:block; }

  .backtotop{
    position: fixed;
    right: 1.1rem; bottom: 1.4rem;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--bg);
    border: none;
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    opacity: 0; visibility: hidden;
    transform: translateY(8px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s;
    z-index: 40;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .backtotop.show{ opacity: 1; visibility: visible; transform: translateY(0); }

  footer{
    text-align: center;
    padding: 2.4rem 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.82rem;
    border-top: 1px solid var(--line);
  }
  footer .mark{
    font-family:'Fraunces', serif;
    color: var(--gold);
    font-size: 1.1rem;
    display:block;
    margin-bottom: 0.5rem;
  }
  footer .legend{
    margin-top: 1rem;
    display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap;
    font-size: 0.78rem;
  }
  footer .legend span{ display:inline-flex; align-items:center; gap: 0.4rem; }
</style>
</head>

/* ---------------- Render ---------------- */
const main = document.getElementById('menuMain');
const noResults = document.getElementById('noResults');
const groupTabsEl = document.getElementById('groupTabs');
const subNavEl = document.getElementById('subNav');

MENU.forEach(g => {
  const gid = g.group.toLowerCase();
  const block = document.createElement('div');
  block.className = 'group-block';
  block.dataset.group = gid;

  block.innerHTML = `<div class="group-title">${g.group}</div><div class="group-sub">${g.sub}</div>` +
    (g.bannerIcons ? `<div class="group-banner" style="background:${g.bannerGrad}">${g.bannerIcons.map(i => icon(i)).join('')}</div>` : '');

  g.categories.forEach(cat => {
    const section = document.createElement('section');
    section.className = 'category';
    section.id = cat.id;
    section.dataset.group = gid;

    let itemsHtml = cat.items.map(it => `
      <li data-search="${(it.n + ' ' + (it.desc||'')).toLowerCase()}">
        <div class="row">
          <span class="veg"></span>
          <span class="item-name">${it.n}</span>
          ${it.spicy ? spiceIcon : ''}
          <span class="leader"></span>
          <span class="price">₹${it.p}</span>
        </div>
        ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ''}
        ${it.tag ? `<span class="badge">${it.tag}</span>` : ''}
      </li>`).join('');

    let addonsHtml = '';
    if (cat.addons) {
      addonsHtml = `<div class="addon"><span class="addon-row"><b>Add on</b></span>` +
        cat.addons.map(a => `<span class="addon-row">${a[0]} ₹${a[1]}</span>`).join('') + `</div>`;
    }

    section.innerHTML = `
      <div class="cat-heading">${icon(cat.icon)}<span>${cat.name}</span></div>
      <ul class="items">${itemsHtml}</ul>
      ${addonsHtml}`;
    block.appendChild(section);
  });

  main.insertBefore(block, noResults);
});

/* ---------------- Group tabs + subnav ---------------- */
let activeGroup = MENU[0].group.toLowerCase();

function renderGroupTabs(){
  groupTabsEl.innerHTML = MENU.map(g => {
    const gid = g.group.toLowerCase();
    return `<button data-group="${gid}" class="${gid===activeGroup?'active':''}">${g.group}</button>`;
  }).join('');
}

function renderSubNav(){
  const g = MENU.find(g => g.group.toLowerCase() === activeGroup);
  subNavEl.innerHTML = g.categories.map(cat =>
    `<a href="#${cat.id}" data-cat="${cat.id}">${icon(cat.icon)}<span>${cat.name}</span></a>`
  ).join('');
}

groupTabsEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  activeGroup = btn.dataset.group;
  renderGroupTabs();
  renderSubNav();
  document.querySelector(`.group-block[data-group="${activeGroup}"] .group-title`)
    .scrollIntoView({ behavior:'smooth', block:'start' });
});

subNavEl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.getElementById(a.dataset.cat).scrollIntoView({ behavior:'smooth', block:'start' });
});

renderGroupTabs();
renderSubNav();

/* ---------------- Scroll spy ---------------- */
const sections = Array.from(document.querySelectorAll('section.category'));
const spy = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const sec = entry.target;
    const g = sec.dataset.group;
    if (g !== activeGroup) {
      activeGroup = g;
      renderGroupTabs();
      renderSubNav();
    }
    const link = subNavEl.querySelector(`a[data-cat="${sec.id}"]`);
    if (link) {
      subNavEl.querySelectorAll('a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      link.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }
  });
}, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
sections.forEach(s => spy.observe(s));

/* ---------------- Entrance animation ---------------- */
const reveal = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      reveal.unobserve(entry.target);
    }
  });
}, { threshold: 0.08 });
sections.forEach(s => reveal.observe(s));

/* ---------------- Search ---------------- */
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearSearch');

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);
  let anyVisible = false;

  document.querySelectorAll('.group-block').forEach(block => {
    let groupHasVisible = false;
    block.querySelectorAll('section.category').forEach(sec => {
      let catHasVisible = false;
      sec.querySelectorAll('ul.items li').forEach(li => {
        const match = !q || li.dataset.search.includes(q);
        li.classList.toggle('hidden', !match);
        if (match) catHasVisible = true;
      });
      sec.classList.toggle('hidden', !catHasVisible);
      if (catHasVisible) { groupHasVisible = true; anyVisible = true; sec.classList.add('in-view'); }
    });
    block.classList.toggle('hidden', !groupHasVisible);
  });

  noResults.classList.toggle('show', q.length > 0 && !anyVisible);
}
searchInput.addEventListener('input', runSearch);
clearBtn.addEventListener('click', () => { searchInput.value=''; runSearch(); searchInput.focus(); });

/* ---------------- Back to top ---------------- */
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  backToTop.classList.toggle('show', window.scrollY > 700);
});
backToTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

/* ---------------- Theme toggle ---------------- */
const themeToggle = document.getElementById('themeToggle');
const iconMoon = document.getElementById('iconMoon');
let isLight = false;
themeToggle.addEventListener('click', () => {
  isLight = !isLight;
  document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
  iconMoon.innerHTML = isLight
    ? '<circle cx="10" cy="10" r="4.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M4.5 15.5l1.4-1.4M14.1 5.9l1.4-1.4"/>'
    : '<path d="M16 11.5A6.5 6.5 0 0 1 8.5 4 6.5 6.5 0 1 0 16 11.5z"/>';
});
</script>
